# Render Blueprint: Brag & Bev AI System
# https://render.com/docs/blueprint-spec
# Python: .python-version or env PYTHON_VERSION=3.11.9
services:
  - type: web
    name: brag-bev-agent
    runtime: python
    region: oregon
    plan: free

    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port=$PORT --server.address=0.0.0.0

    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.9"
